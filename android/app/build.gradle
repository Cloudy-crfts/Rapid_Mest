plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

android {
    namespace "com.rapidmesh.app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        // Java 17 required by flutter_local_notifications desugaring
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Core library desugaring: required by flutter_local_notifications (java.time on old APIs)
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.rapidmesh.app"
        minSdk 30
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // Rapid Mesh: MultiDex support for large app
        multiDexEnabled true
    }

    buildTypes {
        release {
            // Signing with debug keys for now, so `flutter run --release` works
            signingConfig signingConfigs.debug
            
            // Code compression and optimization
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        
        debug {
            debuggable true
            applicationIdSuffix ".debug"
        }
    }

    // Flutter-specific configurations
    flavorDimensions "default"
    productFlavors {
        production {
            dimension "default"
            resValue "string", "app_name", "Rapid Mesh"
        }
        development {
            dimension "default"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Rapid Mesh Dev"
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Explicit appcompat: styles.xml uses Theme.AppCompat.NoActionBar
    implementation 'androidx.appcompat:appcompat:1.7.1'

    // Workaround for a Flutter + desugaring crash on Android 12L+
    // See https://github.com/flutter/flutter/issues/110658
    implementation 'androidx.window:window:1.0.0'
    implementation 'androidx.window:window-java:1.0.0'
}
