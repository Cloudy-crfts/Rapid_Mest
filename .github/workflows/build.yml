name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - run: flutter pub get
      
      # Remove --flavor if your project doesn't use flavors
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: rapid-mesh-apk
          path: build/app/outputs/flutter-apk/app-release.apk
